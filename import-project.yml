name: Import Chatbot Universe

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Import Chatbot Universe project'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download project
        run: |
          curl -L "https://d2ol7oe51mr4n9.cloudfront.net/user_3KOFIzSY4U9WxNf7eA7lz1CMlAX/003b8639-12cc-4934-b845-1719f98ae6ac.zip" -o project.zip
          unzip -o project.zip
          rm project.zip

      - name: Commit project
        run: |
          git config user.name "Chatbot Universe"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Import Chatbot Universe project"
          git push
